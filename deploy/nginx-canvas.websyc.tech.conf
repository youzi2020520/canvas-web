server {
    listen 443 ssl http2;
    server_name canvas.websyc.tech;

    # Use your existing ssl_certificate / ssl_certificate_key here.

    # Streamable HTTP MCP endpoint. Keep buffering off for SSE responses.
    location = /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    }

    location = /mcp-health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    # Full Codex-Canvas browser UI + /api + /assets.
    location / {
        proxy_pass http://127.0.0.1:43217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
